</head>
<body id="pageBody" class="min-h-screen flex flex-col justify-between selection:bg-white/20 selection:text-white relative overflow-x-hidden">
  <div class="fixed inset-0 pointer-events-none z-0">

  </div>

  <header class="w-full relative z-10 pt-safe">
    <div class="w-full px-5 sm:px-8 h-16 sm:h-20 flex items-center justify-between">
      <a href="/" class="font-orbitron font-bold tracking-wider text-base text-white hover:opacity-80 active:opacity-60 transition uppercase py-2">
        pr0jectz3ro
      </a>
      <nav class="flex items-center gap-5 sm:gap-8">
        <a href="/discord/features/" class="nav-item font-orbitron font-bold tracking-wider text-base text-white/70 active:opacity-60 transition uppercase py-2 touch-manipulation">
          Features
        </a>
        <a href="/discord/team/" class="nav-item font-orbitron font-bold tracking-wider text-base text-white/70 active:opacity-60 transition uppercase py-2 touch-manipulation">
          Team
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-5 sm:px-6 py-12 sm:py-16 flex-grow flex flex-col items-center justify-center text-center relative z-10 w-full">
    <!-- Inviter Badge -->
    <div 
      id="invitePopup" 
      class="hidden mb-6 px-4 py-2.5 rounded-full border text-xs sm:text-sm font-medium items-center gap-2 shadow-lg backdrop-blur-md bg-cover bg-center max-w-sm transition-all"
    >
      <span id="popupBadge" class="font-bold px-1.5 py-0.5 rounded text-[11px]"></span>
      <span id="popupMessage"></span>
    </div>

    <h1 id="mainHeading" class="font-orbitron text-3xl sm:text-5xl md:text-6xl font-black tracking-wider uppercase text-white mb-8 sm:mb-10 leading-tight break-words">
      Join the Discord
    </h1>

    <div class="w-full flex flex-col items-center gap-3.5 sm:gap-4 max-w-sm">
      <a 
        id="joinBtn"
        href="https://discord.gg/GZ9fEuctZC" 
        target="_blank" 
        rel="noopener noreferrer"
        class="w-full py-3.5 sm:py-4 px-6 sm:px-8 rounded-2xl bg-white text-black font-bold text-sm sm:text-base active:scale-[0.98] transition shadow-[0_0_35px_rgba(255,255,255,0.18)] flex items-center justify-center gap-2.5 sm:gap-3 touch-manipulation"
      >
        <svg class="w-5 h-5 fill-current shrink-0" viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span>Join Server</span>
      </a>

      <button 
        id="copyBtn"
        onclick="copyCode()"
        class="w-full py-2.5 px-4 rounded-xl border transition text-xs flex items-center justify-center gap-2 touch-manipulation active:scale-[0.99]"
      >
        <span id="copyLabel">Invite Code:</span>
        <span id="codeText" class="font-mono font-bold">GZ9fEuctZC</span>
        <svg id="copyIcon" class="w-3.5 h-3.5 ml-0.5 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
      </button>
    </div>
  </main>

  <footer class="w-full pb-8 pt-4 text-center relative z-10 px-4">
    <div id="footerText" class="inline-flex flex-wrap justify-center items-center gap-1.5 text-xs">
      <a href="https://pr0jectz3ro.eu/legal/" class="footer-link transition underline-offset-4 hover:underline active:opacity-70">
        &copy; 2026 pr0jectz3ro
      </a>
      <span>-</span>
      <span>powered by</span>
      <a href="https://thataustrianone.eu/" target="_blank" rel="noopener noreferrer" class="footer-link transition underline-offset-4 hover:underline active:opacity-70">
        thataustrianone.eu
      </a>
    </div>
  </footer>

  <script>
    let activeCode = 'GZ9fEuctZC';

    // Helper: Converts hex color + percentage opacity (0-100) to rgba()
    function hexToRgba(hex, opacityPercent) {
      if (!hex) return '';
      let cleanHex = hex.replace('#', '').trim();

      // Expand short format (#FFF -> #FFFFFF)
      if (cleanHex.length === 3) {
        cleanHex = cleanHex.split('').map(c => c + c).join('');
      }

      if (cleanHex.length !== 6) return hex;

      const r = parseInt(cleanHex.substring(0, 2), 16);
      const g = parseInt(cleanHex.substring(2, 4), 16);
      const b = parseInt(cleanHex.substring(4, 6), 16);
      const alpha = (parseFloat(opacityPercent) ?? 100) / 100;

      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    async function loadConfig() {
      try {
        const res = await fetch('./config.txt');
        if (!res.ok) return;
        const text = await res.text();

        const cfg = {};
        for (const line of text.split('\n')) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('#')) continue;
          const splitIdx = trimmed.indexOf('=');
          if (splitIdx !== -1) {
            const key = trimmed.slice(0, splitIdx).trim().toLowerCase();
            const val = trimmed.slice(splitIdx + 1).trim();
            cfg[key] = val;
          }
        }

        // 1. Link & Code
        const joinBtn = document.getElementById('joinBtn');
        const codeText = document.getElementById('codeText');
        if (cfg.discord_link && joinBtn) joinBtn.href = cfg.discord_link;
        if (cfg.invite_code) {
          activeCode = cfg.invite_code;
          if (codeText) codeText.innerText = activeCode;
        }

        // 2. Background & Glow
        const body = document.getElementById('pageBody');
        if (cfg.background_color) body.style.backgroundColor = cfg.background_color;
        if (cfg.background_image) {
          const img = new Image();
          img.src = cfg.background_image;
          img.onload = () => { body.style.backgroundImage = `url('${cfg.background_image}')`; };
        }

        if (cfg.background_glow_color) {
          const glow = document.getElementById('ambientGlow');
          const opacity = cfg.background_glow_opacity || 4;
          if (glow) glow.style.backgroundColor = hexToRgba(cfg.background_glow_color, opacity);
        }

        // 3. Headings & Nav
        if (cfg.heading_color) {
          const heading = document.getElementById('mainHeading');
          if (heading) heading.style.color = cfg.heading_color;
        }
        if (cfg.navigation_link_color) {
          document.querySelectorAll('.nav-item').forEach(el => el.style.color = cfg.navigation_link_color);
        }

        // 4. Join Button
        if (cfg.button_color && joinBtn) joinBtn.style.backgroundColor = cfg.button_color;
        if (cfg.button_text_color && joinBtn) joinBtn.style.color = cfg.button_text_color;

        // 5. Code Box
        const copyBtn = document.getElementById('copyBtn');
        const copyLabel = document.getElementById('copyLabel');
        if (copyBtn) {
          if (cfg.code_box_background) {
            const bgOp = cfg.code_box_background_opacity || 100;
            copyBtn.style.backgroundColor = hexToRgba(cfg.code_box_background, bgOp);
          }
          if (cfg.code_box_border) {
            const borderOp = cfg.code_box_border_opacity || 100;
            copyBtn.style.borderColor = hexToRgba(cfg.code_box_border, borderOp);
          }
          if (cfg.code_box_label_color && copyLabel) copyLabel.style.color = cfg.code_box_label_color;
          if (cfg.code_box_text_color && codeText) codeText.style.color = cfg.code_box_text_color;
        }

        // 6. Footer
        if (cfg.footer_text_color) {
          const footer = document.getElementById('footerText');
          if (footer) footer.style.color = cfg.footer_text_color;
        }

        // 7. Invite Badge
        const isBadgeActive = ['yes', 'true', '1'].includes((cfg.show_invite_badge || '').toLowerCase());
        if (isBadgeActive) {
          const popup = document.getElementById('invitePopup');
          const popupBadge = document.getElementById('popupBadge');
          const popupMessage = document.getElementById('popupMessage');

          if (popup && popupBadge && popupMessage) {
            popup.classList.remove('hidden');
            popup.classList.add('inline-flex');

            const inviter = cfg.invited_by || 'Someone';
            const badgeRaw = cfg.badge_icon || '';
            const badgeIcon = Array.from(badgeRaw).slice(0, 3).join('');

            popupMessage.innerText = `${inviter} has invited you`;

            if (badgeIcon) {
              popupBadge.innerText = badgeIcon;
              popupBadge.style.display = 'inline-block';
            } else {
              popupBadge.style.display = 'none';
            }

            if (cfg.badge_background_image) {
              popup.style.backgroundImage = `url('${cfg.badge_background_image}')`;
            } else if (cfg.badge_background_color) {
              const badgeBgOp = cfg.badge_background_opacity || 100;
              popup.style.backgroundColor = hexToRgba(cfg.badge_background_color, badgeBgOp);
            }

            if (cfg.badge_border_color) {
              const borderOp = cfg.badge_border_opacity || 100;
              popup.style.borderColor = hexToRgba(cfg.badge_border_color, borderOp);
            }

            if (cfg.badge_text_color) popup.style.color = cfg.badge_text_color;
            if (cfg.badge_icon_color) popupBadge.style.backgroundColor = cfg.badge_icon_color;
          }
        }
      } catch (err) {
        console.error('Error loading config.txt:', err);
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(activeCode);
      const text = document.getElementById('codeText');
      if (!text) return;
      const original = text.innerText;
      text.innerText = 'Copied!';
      setTimeout(() => text.innerText = original, 1200);
    }

    loadConfig();
  </script>
</body>
</html>
