<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>pr0jectz3ro — Discord</title>
  <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/der46er/pr0jectz3ro/main/assets/favicon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'Cossette Texte';
      src: url('/assets/fonts/CossetteTexte-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Cossette Texte';
      src: url('/assets/fonts/CossetteTexte-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    body {
      font-family: 'Cossette Texte', sans-serif;
      background-color: #070707;
      color: #EDEDED;
      -webkit-tap-highlight-color: transparent;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    .stroke-text {
      paint-order: stroke fill;
      -webkit-text-stroke-linejoin: round;
      -webkit-text-stroke-linecap: round;
    }
    .media-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body id="pageBody" class="min-h-screen flex flex-col justify-between selection:bg-white/20 selection:text-white relative overflow-x-hidden">
  <video id="pageBgVideo" class="media-layer fixed hidden" autoplay loop muted playsinline></video>

  <!-- Ambient glow -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div id="ambientGlow" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[min(600px,100vw)] h-[400px] blur-[140px] rounded-full"></div>
  </div>

  <!-- Header -->
  <header class="w-full relative z-10 pt-safe">
    <div class="w-full px-5 sm:px-8 h-16 sm:h-20 flex items-center justify-between">
      <a href="/" id="brandLogo" class="stroke-text font-orbitron font-bold tracking-wider text-base hover:opacity-80 active:opacity-60 transition uppercase py-2">
        pr0jectz3ro
      </a>
      <nav class="flex items-center gap-5 sm:gap-8">
        <a href="/discord/features/" class="nav-item stroke-text font-orbitron font-bold tracking-wider text-base active:opacity-60 transition uppercase py-2 touch-manipulation">
          Features
        </a>
        <a href="/discord/team/" class="nav-item stroke-text font-orbitron font-bold tracking-wider text-base active:opacity-60 transition uppercase py-2 touch-manipulation">
          Team
        </a>
      </nav>
    </div>
  </header>

  <!-- Conversion Section -->
  <main class="max-w-xl mx-auto px-5 sm:px-6 py-12 sm:py-16 flex-grow flex flex-col items-center justify-center text-center relative z-10 w-full">
    <h1 id="mainHeading" class="stroke-text font-orbitron text-3xl sm:text-5xl md:text-6xl font-black tracking-wider uppercase mb-8 sm:mb-10 leading-tight break-words">
      Join the Discord
    </h1>

    <!-- Action Stack Container -->
    <div id="actionStack" class="w-full flex flex-col items-center gap-3.5 sm:gap-4 max-w-sm relative">
      
      <!-- Shared background media layer when unified mode is active -->
      <div id="unifiedMediaWrapper" class="absolute inset-0 rounded-2xl pointer-events-none overflow-hidden hidden">
        <video id="unifiedBgVideo" class="media-layer hidden" autoplay loop muted playsinline></video>
      </div>

      <!-- 1. Join Button -->
      <a 
        id="joinBtn"
        href="https://discord.gg/default-code" 
        target="_blank" 
        rel="noopener noreferrer"
        class="w-full py-3.5 sm:py-4 px-6 sm:px-8 rounded-2xl font-bold text-sm sm:text-base active:scale-[0.98] transition flex items-center justify-center gap-2.5 sm:gap-3 touch-manipulation relative bg-cover bg-center overflow-hidden z-10"
      >
        <video id="btnBgVideo" class="media-layer hidden" autoplay loop muted playsinline></video>
        <svg id="joinBtnIcon" class="w-5 h-5 fill-current shrink-0 relative z-10" viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span id="joinBtnText" class="stroke-text relative z-10">Join Server</span>
      </a>

      <!-- 2. Code Box -->
      <button 
        id="copyBtn"
        onclick="copyCode()"
        class="w-full py-2.5 px-4 rounded-xl transition text-xs flex items-center justify-center gap-2 touch-manipulation active:scale-[0.99] relative bg-cover bg-center overflow-hidden z-10"
      >
        <video id="codeBoxBgVideo" class="media-layer hidden" autoplay loop muted playsinline></video>
        <span id="copyLabel" class="stroke-text relative z-10">Invite Code:</span>
        <span id="codeText" class="stroke-text font-mono font-bold relative z-10">default-code</span>
        <svg id="copyIcon" class="w-3.5 h-3.5 ml-0.5 opacity-60 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
      </button>

      <!-- 3. Inviter Box -->
      <div 
        id="inviteBubble" 
        class="hidden w-full py-3 px-4 rounded-xl items-center justify-center gap-2.5 relative bg-cover bg-center transition-all overflow-hidden z-10"
      >
        <video id="bubbleBgVideo" class="media-layer hidden" autoplay loop muted playsinline></video>
        <span id="bubbleIconLeft" class="stroke-text text-sm font-bold shrink-0 relative z-10">TXT</span>
        <span id="bubbleMessage" class="stroke-text text-xs sm:text-sm font-semibold tracking-wide text-center relative z-10"></span>
        <span id="bubbleIconRight" class="stroke-text text-sm font-bold shrink-0 hidden relative z-10">TXT</span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full pb-8 pt-4 text-center relative z-10 px-4 mt-auto">
    <div id="footerText" class="inline-flex flex-wrap justify-center items-center gap-1.5 text-xs">
      <a href="https://pr0jectz3ro.eu/legal/" class="stroke-text footer-link inline-block transition underline-offset-4 hover:underline active:opacity-70 touch-target">
        &copy; 2026 pr0jectz3ro
      </a>
      <span class="stroke-text footer-dash inline-block">-</span>
      <span class="stroke-text footer-by inline-block">powered by</span>
      <a href="https://thataustrianone.eu/" target="_blank" rel="noopener noreferrer" class="stroke-text footer-link inline-block transition underline-offset-4 hover:underline active:opacity-70 touch-target">
        thataustrianone.eu
      </a>
    </div>
  </footer>

  <script>
    let activeCode = 'default-code';
    const imageSizeCache = {};

    function isVideo(path) {
      return typeof path === 'string' && (path.endsWith('.mp4') || path.startsWith('data:video/mp4'));
    }

    function setLayerMedia(container, videoEl, sourcePath) {
      if (!container) return;
      if (videoEl && isVideo(sourcePath)) {
        container.style.backgroundImage = 'none';
        if (videoEl.src !== sourcePath) videoEl.src = sourcePath;
        videoEl.classList.remove('hidden');
        videoEl.play().catch(() => {});
      } else if (sourcePath) {
        if (videoEl) {
          videoEl.classList.add('hidden');
          videoEl.pause();
          videoEl.removeAttribute('src');
        }
        container.style.backgroundImage = `url('${sourcePath}')`;
      } else {
        if (videoEl) {
          videoEl.classList.add('hidden');
          videoEl.pause();
          videoEl.removeAttribute('src');
        }
        container.style.backgroundImage = 'none';
      }
    }

    function applyCoverSlice(el, stackEl, imgUrl) {
      if (!el || !stackEl || !imgUrl) return;
      const stackRect = stackEl.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      if (stackRect.width === 0 || stackRect.height === 0) return;

      const apply = (naturalW, naturalH) => {
        const scale = Math.max(stackRect.width / naturalW, stackRect.height / naturalH);
        const renderedW = naturalW * scale;
        const renderedH = naturalH * scale;

        const leftOffset = (stackRect.width - renderedW) / 2;
        const topOffset = (stackRect.height - renderedH) / 2;
        const elementOffsetY = elRect.top - stackRect.top;

        el.style.backgroundImage = `url('${imgUrl}')`;
        el.style.backgroundRepeat = 'no-repeat';
        el.style.backgroundSize = `${renderedW}px ${renderedH}px`;
        el.style.backgroundPosition = `${leftOffset}px ${topOffset - elementOffsetY}px`;
      };

      if (imageSizeCache[imgUrl]) {
        apply(imageSizeCache[imgUrl].w, imageSizeCache[imgUrl].h);
      } else {
        const img = new Image();
        img.src = imgUrl;
        img.onload = () => {
          imageSizeCache[imgUrl] = { w: img.naturalWidth, h: img.naturalHeight };
          apply(img.naturalWidth, img.naturalHeight);
        };
      }
    }

    function hexToRgba(hex, opacityPercent) {
      if (!hex) return '';
      let cleanHex = hex.replace('#', '').trim();
      if (cleanHex.length === 3) cleanHex = cleanHex.split('').map(c => c + c).join('');
      if (cleanHex.length !== 6) return hex;
      const r = parseInt(cleanHex.substring(0, 2), 16);
      const g = parseInt(cleanHex.substring(2, 4), 16);
      const b = parseInt(cleanHex.substring(4, 6), 16);
      const alpha = (parseFloat(opacityPercent) ?? 100) / 100;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyTextStroke(element, color, width = '2.5px') {
      if (!element) return;
      if (color && color !== 'none' && color !== 'transparent') {
        element.style.webkitTextStroke = `${width} ${color}`;
      } else {
        element.style.webkitTextStroke = '0px transparent';
      }
    }

    function applySvgOutline(svgElement, color) {
      if (!svgElement) return;
      if (color && color !== 'none' && color !== 'transparent') {
        svgElement.style.filter = `drop-shadow(1.5px 0 0 ${color}) drop-shadow(-1.5px 0 0 ${color}) drop-shadow(0 1.5px 0 ${color}) drop-shadow(0 -1.5px 0 ${color})`;
      } else {
        svgElement.style.filter = 'none';
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch('./config.txt');
        if (!res.ok) return;
        const text = await res.text();

        const cfg = {};
        for (const line of text.split('\n')) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('#')) continue;
          const splitIdx = trimmed.indexOf('=');
          if (splitIdx !== -1) {
            const key = trimmed.slice(0, splitIdx).trim().toLowerCase();
            const val = trimmed.slice(splitIdx + 1).trim();
            cfg[key] = val;
          }
        }

        // 1. Link & Code
        const joinBtn = document.getElementById('joinBtn');
        const codeText = document.getElementById('codeText');
        if (cfg.discord_link && joinBtn) joinBtn.href = cfg.discord_link;
        if (cfg.invite_code) {
          activeCode = cfg.invite_code;
          if (codeText) codeText.innerText = activeCode;
        }

        // 2. Background & Glow
        const body = document.getElementById('pageBody');
        const pageBgVideo = document.getElementById('pageBgVideo');
        if (cfg.background_color) body.style.backgroundColor = cfg.background_color;
        setLayerMedia(body, pageBgVideo, cfg.background_image);

        const glow = document.getElementById('ambientGlow');
        if (cfg.background_glow_color && glow) {
          const opacity = cfg.background_glow_opacity !== undefined ? cfg.background_glow_opacity : 0;
          glow.style.backgroundColor = hexToRgba(cfg.background_glow_color, opacity);
        }

        // 3. Headings, Logo, Nav, Footer
        const heading = document.getElementById('mainHeading');
        if (heading) {
          if (cfg.heading_color) heading.style.color = cfg.heading_color;
          applyTextStroke(heading, cfg.heading_border_color, '3.5px');
        }

        const logo = document.getElementById('brandLogo');
        if (logo) {
          if (cfg.logo_color) logo.style.color = cfg.logo_color;
          applyTextStroke(logo, cfg.logo_border_color, '2.5px');
        }

        document.querySelectorAll('.nav-item').forEach(el => {
          if (cfg.navigation_link_color) el.style.color = cfg.navigation_link_color;
          applyTextStroke(el, cfg.nav_border_color, '2.5px');
        });

        const footer = document.getElementById('footerText');
        if (footer) {
          if (cfg.footer_text_color) footer.style.color = cfg.footer_text_color;
          footer.querySelectorAll('.stroke-text').forEach(el => {
            applyTextStroke(el, cfg.footer_border_color, '2px');
          });
        }

        // Consistent Box Mode
        const isUnified = ['yes', 'true', '1'].includes((cfg.unified_box_image || '').toLowerCase());
        const unifiedMedia = cfg.box_media || '';
        const actionStack = document.getElementById('actionStack');
        const unifiedWrapper = document.getElementById('unifiedMediaWrapper');
        const unifiedBgVideo = document.getElementById('unifiedBgVideo');

        if (isUnified && unifiedMedia && isVideo(unifiedMedia)) {
          unifiedWrapper.classList.remove('hidden');
          setLayerMedia(unifiedWrapper, unifiedBgVideo, unifiedMedia);
        } else {
          unifiedWrapper.classList.add('hidden');
        }

        // 4. Join Button
        const joinBtnText = document.getElementById('joinBtnText');
        const joinBtnIcon = document.getElementById('joinBtnIcon');
        const btnBgVideo = document.getElementById('btnBgVideo');
        if (joinBtn) {
          if (isUnified && unifiedMedia && !isVideo(unifiedMedia)) {
            applyCoverSlice(joinBtn, actionStack, unifiedMedia);
          } else if (!isUnified && cfg.button_background_image) {
            setLayerMedia(joinBtn, btnBgVideo, cfg.button_background_image);
          } else {
            joinBtn.style.backgroundColor = isUnified ? 'transparent' : (cfg.button_color || '#ffffff');
            joinBtn.style.backgroundImage = 'none';
          }

          if (cfg.button_border_color) {
            const btnBorderOp = cfg.button_border_opacity || 0;
            joinBtn.style.borderWidth = parseInt(btnBorderOp, 10) > 0 ? '1px' : '0px';
            joinBtn.style.borderColor = hexToRgba(cfg.button_border_color, btnBorderOp);
          }

          if (cfg.button_text_color) {
            joinBtn.style.color = cfg.button_text_color;
            if (joinBtnIcon) joinBtnIcon.style.color = cfg.button_text_color;
          }
          applyTextStroke(joinBtnText, cfg.button_text_border_color, '2.5px');
          applySvgOutline(joinBtnIcon, cfg.button_text_border_color);
        }

        // 5. Code Box
        const copyBtn = document.getElementById('copyBtn');
        const copyLabel = document.getElementById('copyLabel');
        const codeBoxBgVideo = document.getElementById('codeBoxBgVideo');
        if (copyBtn) {
          if (isUnified && unifiedMedia && !isVideo(unifiedMedia)) {
            applyCoverSlice(copyBtn, actionStack, unifiedMedia);
          } else if (!isUnified && cfg.code_box_background_image) {
            setLayerMedia(copyBtn, codeBoxBgVideo, cfg.code_box_background_image);
          } else {
            const bgOp = cfg.code_box_background_opacity || 15;
            copyBtn.style.backgroundColor = isUnified ? 'transparent' : hexToRgba(cfg.code_box_background || '#ffffff', bgOp);
            copyBtn.style.backgroundImage = 'none';
          }

          if (cfg.code_box_border) {
            const borderOp = cfg.code_box_border_opacity !== undefined ? cfg.code_box_border_opacity : 100;
            copyBtn.style.borderWidth = parseInt(borderOp, 10) > 0 ? '1px' : '0px';
            copyBtn.style.borderColor = hexToRgba(cfg.code_box_border, borderOp);
          }

          if (cfg.code_box_label_color && copyLabel) copyLabel.style.color = cfg.code_box_label_color;
          if (cfg.code_box_text_color && codeText) codeText.style.color = cfg.code_box_text_color;
          applyTextStroke(copyLabel, cfg.code_box_label_border_color, '2px');
          applyTextStroke(codeText, cfg.code_box_text_border_color, '2px');
        }

        // 6. Inviter Box
        const isBubbleActive = ['yes', 'true', '1'].includes((cfg.show_invite_bubble || '').toLowerCase());
        if (isBubbleActive) {
          const bubble = document.getElementById('inviteBubble');
          const leftIcon = document.getElementById('bubbleIconLeft');
          const rightIcon = document.getElementById('bubbleIconRight');
          const bubbleMessage = document.getElementById('bubbleMessage');
          const bubbleBgVideo = document.getElementById('bubbleBgVideo');

          if (bubble && bubbleMessage) {
            bubble.classList.remove('hidden');
            bubble.classList.add('flex');

            const inviter = cfg.invited_by || '@user';
            const iconRaw = cfg.bubble_icon || 'TXT';
            const iconText = Array.from(iconRaw).slice(0, 3).join('');
            const pos = (cfg.emoji_position || 'left').toLowerCase();

            bubbleMessage.innerText = `${inviter} has invited you`;
            if (cfg.bubble_text_color) bubbleMessage.style.color = cfg.bubble_text_color;
            applyTextStroke(bubbleMessage, cfg.bubble_text_border_color, '2.5px');

            leftIcon.innerText = iconText;
            rightIcon.innerText = iconText;
            if (cfg.bubble_icon_color) {
              leftIcon.style.color = cfg.bubble_icon_color;
              rightIcon.style.color = cfg.bubble_icon_color;
            }
            applyTextStroke(leftIcon, cfg.bubble_icon_border_color, '2.5px');
            applyTextStroke(rightIcon, cfg.bubble_icon_border_color, '2.5px');

            if (pos === 'left') {
              leftIcon.classList.remove('hidden');
              rightIcon.classList.add('hidden');
            } else if (pos === 'right') {
              leftIcon.classList.add('hidden');
              rightIcon.classList.remove('hidden');
            } else if (pos === 'both') {
              leftIcon.classList.remove('hidden');
              rightIcon.classList.remove('hidden');
            } else {
              leftIcon.classList.add('hidden');
              rightIcon.classList.add('hidden');
            }

            if (isUnified && unifiedMedia && !isVideo(unifiedMedia)) {
              applyCoverSlice(bubble, actionStack, unifiedMedia);
            } else if (!isUnified && cfg.bubble_background_image) {
              setLayerMedia(bubble, bubbleBgVideo, cfg.bubble_background_image);
            } else {
              const bBgOp = cfg.bubble_background_opacity || 100;
              bubble.style.backgroundColor = isUnified ? 'transparent' : hexToRgba(cfg.bubble_background_color || '#ffffff', bBgOp);
              bubble.style.backgroundImage = 'none';
            }

            if (cfg.bubble_border_color) {
              const bBorderOp = cfg.bubble_border_opacity || 0;
              bubble.style.borderWidth = parseInt(bBorderOp, 10) > 0 ? '1px' : '0px';
              bubble.style.borderColor = hexToRgba(cfg.bubble_border_color, bBorderOp);
            }
          }
        }
      } catch (err) {
        console.error('Error loading config.txt:', err);
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(activeCode);
      const text = document.getElementById('codeText');
      if (!text) return;
      const original = text.innerText;
      text.innerText = 'Copied!';
      setTimeout(() => text.innerText = original, 1200);
    }

    window.addEventListener('resize', loadConfig);
    loadConfig();
  </script>
</body>
</html>
